name: credential-scan

on:
  pull_request:
  push:
    branches:
      - master
      - 'feature/**'
      - 'epic/**'
      - 'story/**'

permissions:
  contents: read

jobs:
  credential-scan:
    name: grep gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: run credential pattern scan
        run: python scripts/credential_scan.py
