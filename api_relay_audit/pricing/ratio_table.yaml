# ratio_table.yaml — chars-per-token estimates (Story TES-134 / S4-A).
#
# Schema (frozen — see TES-134 §跨 Story 不变量 #3):
#   <vendor>:
#     <model>:
#       zh:      <float>   # chars per token, Chinese-dominant text
#       en:      <float>   # chars per token, ASCII-dominant text
#       default: <float>   # fallback used when language detection is uncertain
#
# Special vendor key ``_default`` provides a global fallback; per-vendor
# ``_default`` model key provides a vendor-wide fallback for unknown models.
#
# Source: empirical ratios derived from public BPE/tiktoken/cl100k tokenizers
# 2026-05; see TES-94 调研集 for the calibration corpus.

